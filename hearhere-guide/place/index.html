<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-itunes-app" content="app-id=6774482528">
  <meta name="robots" content="noindex">
  <title>Open in HearHere Guide</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a1512;color:#f7fbf5;text-align:center}
    main{width:min(100%,520px)}
    img{width:112px;height:112px;border-radius:25px;box-shadow:0 16px 40px rgba(0,0,0,.34)}
    h1{font-size:32px;line-height:1.1;margin:24px 0 12px}
    p{font-size:18px;color:#c7d7ce;margin:0 0 28px}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 22px;border-radius:24px;background:#f7fbf5;color:#0a1512;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
<main>
  <img src="../icon.png" alt="HearHere Guide app icon">
  <h1 id="title">Open this place in HearHere Guide</h1>
  <p>If HearHere Guide is not installed, we’ll take you to its App Store page.</p>
  <a id="store-link" href="https://apps.apple.com/app/id6774482528">Get HearHere Guide</a>
</main>
<script>
  const appStoreURL = "https://apps.apple.com/app/id6774482528";
  const placeName = new URLSearchParams(window.location.search).get("name");
  if (placeName) document.getElementById("title").textContent = `Open ${placeName} in HearHere Guide`;
  window.setTimeout(() => window.location.replace(appStoreURL), 900);
</script>
</body>
</html>
